<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Frisco Memorial Volleyball All-Time Record Board</title>
  <style>
    :root {
      --bg: #0d0f12;
      --card-bg: #161a22;
      --card-border: #2a313d;
      --gold: #d4af37;
      --gold-light: #f3e5ab;
      --text-main: #f0f3f6;
      --text-muted: #8b949e;
      --accent: #238636;
      --pill-bg: #21262d;

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 16px; line-height: 1.4; }
    .header { text-align: center; padding: 16px 8px 16px; border-bottom: 2px solid var(--card-border); max-width: 900px; margin: 0 auto; }
    .badge { display: inline-block; background: var(--gold); color: #000; font-weight: 800; font-size: 11px; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    h1 { font-size: 24px; font-weight: 800; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; }
    .subtitle { color: var(--gold); font-size: 14px; font-weight: 600; margin-top: 4px; }
    .last-updated { font-size: 11px; color: var(--text-muted); margin-top: 6px; letter-spacing: 0.5px; }
    .team-banner { background: linear-gradient(90deg, #1f1b0e, #2b2512); border: 1px solid var(--gold); border-radius: 8px; padding: 12px 16px; margin: 16px auto; max-width: 900px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .team-banner span { font-weight: 700; font-size: 14px; color: var(--gold-light); }
    .nav-tabs { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0; max-width: 900px; margin: 0 auto; -webkit-overflow-scrolling: touch; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; flex-shrink: 0; }
    .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }
    .container { max-width: 900px; margin: 0 auto; }
    .view-panel { display: none; }
    .view-panel.active { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; margin-top: 14px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; margin-bottom: 12px; }
    .card-title { font-size: 15px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.5px; }
    .leader-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .leader-row:last-child { border-bottom: none; }
    .rank { font-weight: 800; color: var(--gold); width: 22px; font-size: 14px; }
    .player-name { font-weight: 600; font-size: 14px; color: var(--text-main); }
    .player-sub { font-size: 11px; color: var(--text-muted); }
    .stat-val { font-weight: 700; font-size: 15px; color: #fff; text-align: right; }
    .active-badge { background: #238636; color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
    .progress-bar-bg { background: #21262d; border-radius: 999px; height: 8px; width: 100%; margin: 8px 0 4px; overflow: hidden; }
    .progress-bar-fill { background: linear-gradient(90deg, #d4af37, #ffd700); height: 100%; border-radius: 999px; }
    .target-text { font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; }
    .grade-selector { display: flex; gap: 6px; margin: 12px 0; }
    .grade-btn { background: var(--pill-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: 600; }
